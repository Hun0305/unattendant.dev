<p class="post-meta">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ i18n "published" }} {{ .Date | time.Format ":date_long" }}</time>
  {{- if gt .Lastmod.Unix .Date.Unix }}
  · <time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ i18n "updated" }} {{ .Lastmod | time.Format ":date_long" }}</time>
  {{- end }}
  {{- with .GetTerms "tags" }}
  · {{ range $i, $t := . }}{{ if $i }} {{ end }}<a href="{{ $t.RelPermalink }}">#{{ $t.LinkTitle }}</a>{{ end }}
  {{- end }}
</p>
