{{- /*
  모든 페이지 맨 위의 Pi 상태 띠.
  값은 Pi가 몇 분마다 갱신하는 /status.json을 브라우저가 읽어 채운다(status-script.html).
  파일이 없거나 읽지 못하면 "운영 준비 중"만 보인다. 30분 넘게 갱신이 없으면 회색 점과 "갱신 멈춤".
*/ -}}
<div class="band" data-status>
  <div class="wrap band-in">
    <span class="dot" data-status-dot></span>
    <span class="band-idle" data-status-idle>{{ i18n "bandIdle" }}</span>
    <span class="band-stats" data-status-stats hidden>
      <span>{{ i18n "bandDays" }} <b data-k="unattended_days"></b>{{ i18n "bandDaysUnit" }}</span>
      <span>CPU <b data-k="cpu_temp_c"></b></span>
      <span>{{ i18n "bandCost" }} <b data-k="cost_today_krw"></b></span>
    </span>
    <a class="band-link" href="{{ "numbers/" | relLangURL }}#pi">{{ i18n "bandLink" }} →</a>
  </div>
</div>
