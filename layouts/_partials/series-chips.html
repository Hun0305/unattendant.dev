{{- /* 홈 상단 시리즈 바로가기. 글이 있는 시리즈만 글 수를 붙인다 */ -}}
{{ with site.GetPage "/series" }}
<nav class="chips" aria-label="{{ i18n "tabSeries" }}">
  {{ range .Pages.ByWeight }}
  <a href="{{ .RelPermalink }}"><b>{{ .Title }}</b>{{ with len .Pages }}<span>{{ i18n "postsCount" . }}</span>{{ end }}</a>
  {{ end }}
</nav>
{{ end }}
