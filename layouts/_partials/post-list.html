{{- /* 인자: 글 목록(Pages). 비어 있으면 안내 문구를 보인다. */ -}}
{{ with . }}
<ul class="post-list">
  {{ range . }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_medium" }}</time>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ if eq .Params.author "human" }}<span class="badge">{{ if eq .Language.Lang "ko" }}사람{{ else }}human{{ end }}</span>{{ end }}
  </li>
  {{ end }}
</ul>
{{ else }}
<p class="empty">{{ i18n "noPosts" }}</p>
{{ end }}
